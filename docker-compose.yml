services:
  backend:
    build: .
    container_name: edupilot-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data/uploads:/app/data/uploads

  frontend:
    build: .
    container_name: edupilot-frontend
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      EDUPILOT_API_URL: http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data/uploads:/app/data/uploads